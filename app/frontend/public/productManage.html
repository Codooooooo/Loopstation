    <div class="form">
        <form class="type">
            <div>
                <h3>Product information</h3>
            </div>
            <div class="item">
                <div class="column-lab">
                    <label for="pID">Product ID</label>
                    <input type="text" id="productID" placeholder="Product ID">
                </div>
                <div class="column-lab">
                    <label for="pName">Product Name</label>

                <div class="column-lab">
                    <label for="pDescript">Description</label>
                    <input type="text" id="des" placeholder="Brief des">
                </div>
                <div class="column-lab">
                    <label for="pRate">rating</label>
                    <input type="text" id="rate" placeholder="xx% New">
                </div>
                <div class="column-lab">

                <div class="column-lab">
                    <label for="pColor">Product Color</label>
                    <input type="text" id="color" placeholder="Product Color">

                <div class="column-lab">

                    <input type="text" id="inche" placeholder="xx inches/xx mm">
                </div>
                <div class="column-lab">
                    <label for="pMemory">Product Memory Size</label>
                    <input type="text" id="memory" placeholder="Product Memory">
                </div>
                <div class="column-lab">
                    <label for="pInternet">Product Internet Version</label>
                    <input type="text" id="internet" placeholder="Product Internet Version">
                </div>
                <div class="column-lab">
                    <label for="pPrice">Product Price</label>
                    <input type="text" id="price" placeholder="Product Price">
                </div>
                <div class="column-lab">
                    <label for="rID">Reprot ID</label>
                    <input type="text" id="report" placeholder="ID of the report">
                </div>
    
                <div class="bottem">
                    <input type="button" id="edit_p" value="Edit">
                    <input type="button" id="deleteItem_p" value="Delete">
                    <input type="button" id="add_p" value="Add">
                </div>
                <form class="file" action="upload.php" method="post" enctype="multipart/form-data">
                    <h2>Upload The report</h2>
                    <p><input id="ima" type="file" name="image" required></p>
                    <p><input id="upl" type="submit" value="Upload"></p>
                </form>
            </div>
        </form>
        <div class="container">
            <h1>Search for Products</h1>
            <form id="search-form">
                <label for="name">Search by name:</label>
                <input type="text" id="name" name="name">
                <label for="type">Search by type:</label>
                <select id="type" name="type">
                    <option value="">--Select Type--</option>
                    <option value="iPhone">iPhone</option>
                    <option value="iPad">iPad</option>
                    <option value="Apple Watch">Apple Watch</option>
                </select>
                <label for="rating">Search by rating:</label>
                <select id="rating" name="rating">
                    <option value="">--Select Rating--</option>
                    <option value="99% New">99% New</option>
                    <option value="90% New">90% New</option>
                    <option value="85% New">85% New</option>
                    <option value="80% New">80% New</option>
                </select>
                <input type="submit" value="Search">
            </form>
            <br>
            <table>
                <thead>
                    <tr>
                        <th>Product/Service Name</th>
                        <th>Description</th>
                        <th>Rating</th>
                        <th>Type</th>
                        <th>Detail</th>
                    </tr>
                </thead>
                <tbody id="results-list">
                    <!-- Search results will be inserted here -->

            </table>
