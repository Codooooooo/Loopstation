<!DOCTYPE html>
<html lang="en">

<head>
	<title>Search Page</title>
	<link rel="stylesheet" href="css/search.css">
</head>

<body>
	<header>
		<img class="logo_homepage" src="image\logo.png">
	</header>
	<nav>
		<a href="homePage"><i class="Homepage"></i> Homepage</a>
		<a href="login"><i class="LoginPage"></i> Login</a>
		<a href="Aboutus"><i class="AboutUsPage"></i> About Us</a>
	</nav>
	<div class="container">
		<h1>Search for Products</h1>
		<form id="search-form">
			<label for="name">Search by name:</label>
			<input type="text" id="name" name="name">
			<label for="type">Search by type:</label>
			<select id="type" name="type">
				<option value="">--Select Type--</option>
				<option value="iPhone">iPhone</option>
				<option value="iPad">iPad</option>
				<option value="Apple Watch">Apple Watch</option>
			</select>
			<label for="rating">Search by rating:</label>
			<select id="rating" name="rating">
				<option value="">--Select Rating--</option>
				<option value="99% New">99% New</option>
				<option value="90% New">90% New</option>
				<option value="85% New">85% New</option>
				<option value="80% New">80% New</option>
			</select>
			<input type="submit" value="Search">
		</form>
		<br>
		<table>
			<thead>
				<tr>
					<th>Product/Service Name</th>
					<th>Description</th>
					<th>Rating</th>
					<th>Type</th>
					<th>Detail</th>
				</tr>
			</thead>
			<tbody id="results-list">
				<!-- Search results will be inserted here -->
			</tbody>
		</table>
	</div>

	<footer>
		<div class="column">
			<h1>Loopstation</h1>
			<a href="Aboutus"><i class="AboutUsPage"></i>
				<h4>About us</h4>
			</a>
			<h4>Our Services</h4>
			<h4>History</h4>
		</div>

		<div class="column">
			<h1>Policy</h1>
			<h4>Privacy</h4>
			<h4>Payment</h4>
			<h4>Return</h4>
		</div>
		<div class="column">
			<h1>Help</h1>
			<h4>FAQ</h3>
				<h4>Customer Service</h4>
				<h4>Order</h4>
		</div>
	</footer>
	<script src="/javascript/searchFun.js"></script>
		
</body>

</html>
